version: 2
updates:
  - package-ecosystem: nuget
    directory: "/src"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
      prefix-development: chore(dev)
    labels:
      - "enhancement"
    open-pull-requests-limit: 10
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "MSTest*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
    labels:
      - "enhancement"
    open-pull-requests-limit: 10
